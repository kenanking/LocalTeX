[package]
name = "localtex"
version = "0.1.0"
edition = "2024"
authors = ["Yan Tang"]
description = "Offline screenshot OCR: snip the screen, get Markdown or LaTeX"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/kenanking/LocalTeX"
repository = "https://github.com/kenanking/LocalTeX"
keywords = ["ocr", "latex", "markdown", "screenshot", "gpui"]
categories = ["gui", "text-processing"]
publish = false

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "c8e44cfa7bda9b2e22c8d6934d78969352e7f61a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c8e44cfa7bda9b2e22c8d6934d78969352e7f61a", default-features = false, features = ["x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
xcap = "0.9"
# rc.13 is required for MatMulNBits + the GQA UniRec decoder.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["download-binaries", "std", "tls-rustls"] }
serde_json = { version = "1", features = ["preserve_order"] }
fast_image_resize = "5"
regex = "1"
dirs = "6"
global-hotkey = "0.8"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }
# 1.x is the latest stable; 2.0 is still alpha (and already pulled by ort).
smallvec = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
unicode-segmentation = "1"
latex2mathml = "0.2.3"
tex2word-math = "1.0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
rust-i18n = "4"

[build-dependencies]
# Host-gated by CARGO_CFG_TARGET_OS in build.rs; no-op on Linux/macOS.
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(target_os = "linux")'.dependencies]
# blocking = no extra tokio runtime (0.3 default is async).
ksni = { version = "0.3", features = ["blocking"] }
x11rb = { version = "0.13", features = ["image", "render"] }
# Direct PNG CLIPBOARD write; GPUI 0.2 X11 write_to_clipboard is text-only.
x11-clipboard = "0.9"
# statvfs + sysconf for the settings System tab.
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
# Not a default feature: without this, xcap BitBlts the desktop DC.
xcap = { version = "0.9", features = ["wgc"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Distribution binary. Thin LTO + one CGU is a multi-minute link of GPUI +
# static ONNX Runtime (~45 MB). Use `dev-opt` while iterating.
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Desktop iteration: same opt-level as release, no LTO. Incremental rebuilds
# of localtex are seconds instead of ~1 minute.
[profile.dev-opt]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

